<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Illustrated Tampermonkey WEdit installation page</title>
  <desc id="desc">The raw WEdit userscript opens a Tampermonkey installation screen. The Install button at the top right is circled.</desc>
  <rect width="1200" height="650" rx="24" fill="#f1f5f9"/>
  <text x="54" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">STEP 2 · Install WEdit</text>
  <text x="54" y="91" font-family="Arial,sans-serif" font-size="17" fill="#475569">Open the direct userscript link, then click Install</text>
  <rect x="54" y="125" width="1092" height="455" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="54" y="125" width="1092" height="46" rx="18" fill="#e2e8f0"/>
  <circle cx="82" cy="148" r="7" fill="#ef4444"/><circle cx="106" cy="148" r="7" fill="#f59e0b"/><circle cx="130" cy="148" r="7" fill="#22c55e"/>
  <rect x="176" y="136" width="870" height="25" rx="12" fill="#fff"/>
  <text x="192" y="154" font-family="Arial,sans-serif" font-size="12" fill="#64748b">raw.githubusercontent.com/yoericwsg/wedit-whatsapp-preview/main/wedit.user.js</text>
  <rect x="54" y="171" width="1092" height="57" fill="#0f172a"/>
  <text x="82" y="207" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">Tampermonkey</text>
  <text x="82" y="270" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#0f172a">Install user script</text>
  <text x="82" y="308" font-family="Arial,sans-serif" font-size="20" fill="#334155">WEdit — WhatsApp Local Preview Editor</text>
  <text x="82" y="340" font-family="Arial,sans-serif" font-size="15" fill="#64748b">Version 4.0.0 · by yoericwsg</text>
  <line x1="82" y1="365" x2="1114" y2="365" stroke="#e2e8f0" stroke-width="2"/>
  <text x="82" y="408" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Matches</text>
  <text x="82" y="438" font-family="Arial,sans-serif" font-size="15" fill="#475569">https://web.whatsapp.com/*</text>
  <text x="82" y="492" font-family="Arial,sans-serif" font-size="14" fill="#64748b">Review the script name and site match, then install.</text>
  <rect x="910" y="255" width="178" height="58" rx="9" fill="#2563eb"/>
  <text x="999" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">Install</text>
  <rect x="900" y="245" width="198" height="78" rx="14" fill="none" stroke="#f97316" stroke-width="5"/>
  <path d="M875 338 C840 371 838 405 873 425" fill="none" stroke="#f97316" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="82" y="526" width="1008" height="34" rx="8" fill="#fff7ed"/>
  <text x="100" y="549" font-family="Arial,sans-serif" font-size="14" fill="#9a3412">If the page shows code only, check that Tampermonkey is enabled, then reopen the direct link.</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f97316"/></marker></defs>
</svg>
