<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Illustrated WhatsApp Web with WEdit open</title>
  <desc id="desc">WhatsApp Web mock chat with the WEdit panel open at the right and the Alt Shift E shortcut highlighted.</desc>
  <rect width="1200" height="650" rx="24" fill="#f1f5f9"/>
  <text x="54" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">STEP 3 · Open WEdit in WhatsApp Web</text>
  <text x="54" y="91" font-family="Arial,sans-serif" font-size="17" fill="#475569">Reload the WhatsApp Web tab, then press Alt + Shift + E</text>
  <rect x="54" y="125" width="1092" height="455" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="54" y="125" width="1092" height="46" rx="18" fill="#e2e8f0"/>
  <circle cx="82" cy="148" r="7" fill="#ef4444"/><circle cx="106" cy="148" r="7" fill="#f59e0b"/><circle cx="130" cy="148" r="7" fill="#22c55e"/>
  <rect x="176" y="136" width="820" height="25" rx="12" fill="#fff"/>
  <text x="192" y="154" font-family="Arial,sans-serif" font-size="13" fill="#64748b">web.whatsapp.com</text>
  <rect x="54" y="171" width="220" height="409" fill="#f8fafc"/>
  <rect x="274" y="171" width="600" height="409" fill="#efeae2"/>
  <rect x="874" y="171" width="272" height="409" fill="#fff"/>
  <rect x="54" y="171" width="220" height="58" fill="#f0f2f5"/>
  <circle cx="87" cy="200" r="18" fill="#22c55e"/>
  <text x="117" y="205" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1e293b">Chats</text>
  <rect x="295" y="258" width="180" height="57" rx="12" fill="#fff"/>
  <text x="313" y="292" font-family="Arial,sans-serif" font-size="15" fill="#334155">Hey, how's it going?</text>
  <rect x="549" y="338" width="280" height="62" rx="12" fill="#d9fdd3"/>
  <text x="568" y="365" font-family="Arial,sans-serif" font-size="15" fill="#334155">Local preview appears here</text>
  <text x="568" y="387" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Only visible in your browser</text>
  <rect x="874" y="171" width="272" height="56" fill="#f0f2f5"/>
  <text x="896" y="205" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0f172a">WEdit</text>
  <rect x="896" y="248" width="228" height="54" rx="10" fill="#2563eb"/>
  <text x="1010" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Select a message</text>
  <text x="896" y="336" font-family="Arial,sans-serif" font-size="14" fill="#475569">Create a local preview</text>
  <text x="896" y="363" font-family="Arial,sans-serif" font-size="14" fill="#475569">Add images and stickers</text>
  <text x="896" y="390" font-family="Arial,sans-serif" font-size="14" fill="#475569">Save or restore previews</text>
  <rect x="295" y="462" width="350" height="74" rx="14" fill="#fff" stroke="#f97316" stroke-width="4"/>
  <text x="470" y="491" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#9a3412">SHORTCUT</text>
  <text x="470" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">Alt  +  Shift  +  E</text>
</svg>
