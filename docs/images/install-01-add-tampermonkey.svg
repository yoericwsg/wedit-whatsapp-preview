<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Illustrated Tampermonkey browser store installation</title>
  <desc id="desc">A browser store page with the Add to Chrome button highlighted, followed by the browser confirmation pop-up with Add extension highlighted.</desc>
  <rect width="1200" height="650" rx="24" fill="#f1f5f9"/>
  <text x="54" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">STEP 1 · Add Tampermonkey</text>
  <text x="54" y="91" font-family="Arial,sans-serif" font-size="17" fill="#475569">Illustrated click map · choose the matching button in your browser</text>
  <rect x="54" y="125" width="1092" height="455" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="54" y="125" width="1092" height="46" rx="18" fill="#e2e8f0"/>
  <circle cx="82" cy="148" r="7" fill="#ef4444"/><circle cx="106" cy="148" r="7" fill="#f59e0b"/><circle cx="130" cy="148" r="7" fill="#22c55e"/>
  <rect x="176" y="136" width="560" height="25" rx="12" fill="#fff"/>
  <text x="192" y="154" font-family="Arial,sans-serif" font-size="13" fill="#64748b">chromewebstore.google.com · Tampermonkey</text>
  <rect x="95" y="205" width="86" height="86" rx="20" fill="#1d4ed8"/>
  <path d="M124 222h28l-7 18 17 13-18 7-3 22-15-14-18 8 5-21-14-14 21-2z" fill="#fff"/>
  <text x="208" y="239" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a">Tampermonkey</text>
  <text x="208" y="271" font-family="Arial,sans-serif" font-size="16" fill="#64748b">by Jan Biniok · Userscript manager</text>
  <rect x="850" y="215" width="240" height="58" rx="10" fill="#1a73e8"/>
  <text x="970" y="251" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">Add to Chrome</text>
  <rect x="842" y="207" width="256" height="74" rx="14" fill="none" stroke="#f97316" stroke-width="5"/>
  <path d="M822 298 C780 335 775 371 819 389" fill="none" stroke="#f97316" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="610" y="365" width="480" height="150" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="642" y="400" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0f172a">Add “Tampermonkey”?</text>
  <text x="642" y="430" font-family="Arial,sans-serif" font-size="15" fill="#475569">Confirm the browser prompt to finish adding it.</text>
  <rect x="835" y="453" width="220" height="44" rx="9" fill="#1a73e8"/>
  <text x="945" y="481" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Add extension</text>
  <rect x="827" y="445" width="236" height="60" rx="12" fill="none" stroke="#f97316" stroke-width="5"/>
  <text x="95" y="348" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#c2410c">1. Click Add to Chrome / Get</text>
  <text x="95" y="380" font-family="Arial,sans-serif" font-size="15" fill="#475569">Edge and Firefox use slightly different button names.</text>
  <text x="95" y="435" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#c2410c">2. Confirm the pop-up</text>
  <text x="95" y="467" font-family="Arial,sans-serif" font-size="15" fill="#475569">Click Add extension / Add.</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f97316"/></marker></defs>
</svg>
